name: SimulatorCamera

# v1.0.0 architecture: macOS container app + bundled CMIOExtension system extension.
# The container hosts the SwiftUI UI and submits OSSystemExtensionRequest activation;
# the extension (bundled inside Contents/Library/SystemExtensions/) registers a
# virtual camera that the iOS Simulator can pick up via standard AVFoundation.

options:
  bundleIdPrefix: jp.co.bluecode
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: en
  createIntermediateGroups: true
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    MARKETING_VERSION: "1.0.1"
    CURRENT_PROJECT_VERSION: "6"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    # Locked to BLUECODE,INC. team (C5TUJ8526Z). For
    # Distribution builds (notarized DMG release), override at the
    # xcodebuild command line: DEVELOPMENT_TEAM=C5TUJ8526Z.
    DEVELOPMENT_TEAM: C5TUJ8526Z
    CODE_SIGN_STYLE: Automatic
    # Force the modern unified "Apple Development" cert type instead of
    # the legacy "Mac Developer" that Xcode picks by default for macOS apps.
    CODE_SIGN_IDENTITY: "Apple Development"
    "CODE_SIGN_IDENTITY[sdk=macosx*]": "Apple Development"

targets:
  SimulatorCamera:
    type: application
    platform: macOS
    sources:
      - path: SimulatorCamera
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Shared
    info:
      path: SimulatorCamera/Info.plist
      properties:
        # Shown in the menu bar, Dock and window.
        CFBundleDisplayName: SimulatorCameraEx
        CFBundleName: SimulatorCameraEx
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHighResolutionCapable: true
        LSApplicationCategoryType: public.app-category.developer-tools
        NSCameraUsageDescription: SimulatorCamera streams your Mac's webcam to the iOS Simulator. (v1.1+ feature; v1.0 ships test pattern only.)
        NSSystemExtensionUsageDescription: SimulatorCamera installs a Camera Extension so the iOS Simulator can capture video without a physical device.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.co.bluecode.SimulatorCameraEx
        PRODUCT_NAME: SimulatorCameraEx
        # The SimCamInject build phase runs clang + codesign, which need
        # temp/cache writes the user-script sandbox refuses.
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        # SimulatorCamera/Assets.xcassets, drawn by scripts/make-icon.swift.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: SimulatorCamera/SimulatorCamera.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
    dependencies:
      - target: SimulatorCameraExtension
        copy:
          destination: plugins
          subpath: ../Library/SystemExtensions
        embed: true
        codeSign: true
      # Ship the CLI inside the app bundle (Contents/MacOS/simcamctl) so the
      # DMG / cask can expose it without a separate download.
      - target: simcamctl
        copy:
          destination: executables
        embed: true
        codeSign: true

    postBuildScripts:
      # iOS Simulator camera: SimCamInject dylibs, loaded into Simulator apps
      # by `simcamctl sim-enable` / `sim-launch`. Built for iphonesimulator
      # and signed with the app's identity before the app itself is sealed.
      - name: Build SimCamInject
        script: |
          SIGN_IDENTITY="${EXPANDED_CODE_SIGN_IDENTITY:--}" \
            "${SRCROOT}/SimCamInject/build.sh" "${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/SimCamInject"
        inputFiles:
          - $(SRCROOT)/SimCamInject/build.sh
          - $(SRCROOT)/SimCamInject/SimCamLoader.c
          - $(SRCROOT)/SimCamInject/SimCamInject.m
          - $(SRCROOT)/SimCamInject/SimCamFrameSource.m
          - $(SRCROOT)/SimCamInject/SimCamFrameSource.h
          - $(SRCROOT)/SimCamInject/SimCamWeb.m
          - $(SRCROOT)/SimCamInject/SimCamWeb.h
          - $(SRCROOT)/SimCamInject/SimCamWebShim.js
        outputFiles:
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/SimCamInject/SimCamLoader.dylib
          - $(TARGET_BUILD_DIR)/$(UNLOCALIZED_RESOURCES_FOLDER_PATH)/SimCamInject/SimCamInject.dylib

  SimulatorCameraExtension:
    type: system-extension
    platform: macOS
    sources:
      - path: SimulatorCameraExtension
        excludes:
          - "Info.plist"
          - "*.entitlements"
      - path: Shared
        excludes:
          - "AndroidEmulator.swift"
    info:
      path: SimulatorCameraExtension/Info.plist
      properties:
        CFBundleDisplayName: SimulatorCamera Extension
        CFBundlePackageType: SYSX
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSSystemExtensionUsageDescription: SimulatorCamera registers a virtual camera so the iOS Simulator can capture video without a physical device.
        # Camera Extensions use CMIOExtension Info.plist key only — NOT
        # NSExtension. NSExtension is for app extensions (Today widgets,
        # Share extensions, etc.). Camera Extensions are discovered by
        # CMIOExtensionProvider.startService() in main.swift, with the
        # Mach service name registered via this dict.
        # Reference: Apple's Camera Extension Xcode template TemplateInfo.plist
        # only declares CMIOExtension + NSSystemExtensionUsageDescription.
        CMIOExtension:
          CMIOExtensionMachServiceName: $(TeamIdentifierPrefix)jp.co.bluecode.SimulatorCameraEx.Extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.co.bluecode.SimulatorCameraEx.Extension
        # sysextd locates the extension by file name, so the bundle must be
        # named <bundle id>.systemextension (same as Apple's template).
        PRODUCT_NAME: $(PRODUCT_BUNDLE_IDENTIFIER)
        CODE_SIGN_ENTITLEMENTS: SimulatorCameraExtension/SimulatorCameraExtension.entitlements
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES

  simcamctl:
    type: tool
    platform: macOS
    sources:
      - path: simcamctl
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.co.bluecode.simcamctl
        PRODUCT_NAME: simcamctl
        CODE_SIGN_STYLE: Automatic
        # Embed an Info.plist so the code-signing identifier is the bundle
        # id (jp.co.bluecode.simcamctl) rather than the bare product name;
        # the extension only accepts sink producers with that signing ID.
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        ENABLE_HARDENED_RUNTIME: YES
        # Shipped only inside the app (Contents/MacOS). Installing it to
        # /usr/local/bin as well would make the archive a generic one that
        # Xcode cannot export with Developer ID.
        SKIP_INSTALL: YES

  # Logic tests for the wire contract shared by all three binaries. Compiles
  # the Shared sources directly (no host app needed), so it runs unsigned on
  # CI and on a machine where the extension was never activated.
  SimulatorCameraTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: jp.co.bluecode.SimulatorCameraEx.Tests
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES

schemes:
  SimulatorCamera:
    build:
      targets:
        SimulatorCamera: all
        SimulatorCameraExtension: all
        SimulatorCameraTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - SimulatorCameraTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
  simcamctl:
    build:
      targets:
        simcamctl: all
    run:
      config: Debug
    archive:
      config: Release
